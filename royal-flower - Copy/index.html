<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Flower | رويال فلاور - Kings of Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1e2a52; --pink:#d6246e; --pink-soft:#fdeef3; --pink-mid:#f9d7e4;
  --white:#ffffff; --gold:#c9a24b; --text:#3a3f58; --shadow:0 10px 30px rgba(214,36,110,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--pink-soft);color:var(--text);line-height:1.7}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.container{max-width:1180px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{color:var(--navy);font-weight:900}
.section{padding:70px 0}
.section-title{text-align:center;font-size:2rem;margin-bottom:6px}
.section-sub{text-align:center;color:var(--pink);margin-bottom:40px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pink);color:#fff;padding:13px 34px;border-radius:50px;font-weight:700;box-shadow:0 8px 20px rgba(214,36,110,.35);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(214,36,110,.45)}
.btn.ghost{background:#fff;color:var(--pink);border:2px solid var(--pink);box-shadow:none}
/* topbar */
.topbar{background:var(--navy);color:#fff;font-size:.85rem}
.topbar .container{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.topbar span{display:inline-flex;align-items:center;gap:6px}
/* header */
header{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:50;box-shadow:0 2px 14px rgba(30,42,82,.07)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0}
.logo{display:flex;flex-direction:column;line-height:1.1}
.logo .name{font-family:'Great Vibes',cursive;font-size:2rem;color:var(--navy)}
.logo .tag{font-size:.72rem;letter-spacing:2px;color:var(--pink);font-weight:700}
nav.links{display:flex;gap:22px;font-weight:600;font-size:.95rem}
nav.links a:hover{color:var(--pink)}
.lang-pill{display:flex;border:2px solid var(--pink);border-radius:50px;overflow:hidden;font-weight:700;font-size:.85rem}
.lang-pill button{border:0;background:transparent;padding:6px 16px;cursor:pointer;color:var(--pink);font-family:inherit;font-weight:700}
.lang-pill button.active{background:var(--pink);color:#fff}
/* hero */
.hero{padding:60px 0 70px}
.hero .container{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
.hero h1{font-size:2.9rem;line-height:1.35}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{margin:18px 0 26px;font-size:1.1rem}
.hero-img{border-radius:28px;overflow:hidden;box-shadow:var(--shadow);transform:rotate(-2deg)}
[dir="ltr"] .hero-img{transform:rotate(2deg)}
.hero-badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chip{background:#fff;border-radius:50px;padding:8px 18px;font-size:.85rem;font-weight:700;color:var(--navy);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.chip .star{color:#f5a623}
svg.icn{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.18em}
svg.icn.fill-gold{fill:#f5a623;stroke:none}
.topbar svg.icn{width:13px;height:13px}
.feature .ic{display:block;margin-bottom:6px}
.feature .ic svg{width:36px;height:36px;stroke:var(--pink)}
.visit li .ic svg{width:18px;height:18px;stroke:var(--pink);flex-shrink:0;margin-top:4px}
.chip svg.icn{stroke:var(--pink)}
.contact-list svg.icn{width:15px;height:15px;stroke:var(--pink)}
.btn svg.icn{width:17px;height:17px}
/* features */
.features{background:#fff;padding:26px 0}
.features .container{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:center}
.feature{font-weight:700;color:var(--navy)}
.feature .ic{font-size:1.6rem;display:block;margin-bottom:4px}
/* categories */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cat{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-align:center;transition:.25s}
.cat:hover{transform:translateY(-6px)}
.cat img{height:150px;width:100%;object-fit:cover}
.cat .t{padding:12px 8px;font-weight:700;color:var(--navy);font-size:.95rem}
/* products */
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.prod{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:.25s}
.prod:hover{transform:translateY(-6px)}
.prod img{height:230px;width:100%;object-fit:cover}
.prod .body{padding:16px}
.prod .name{font-weight:700;color:var(--navy);margin-bottom:4px}
.prod .price{color:var(--pink);font-weight:900;font-size:1.15rem;margin-bottom:12px}
.prod .order{width:100%;justify-content:center;padding:11px;font-size:.95rem}
/* visit */
.visit{background:#fff}
.visit .container{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
.visit img{border-radius:24px;box-shadow:var(--shadow)}
.visit h2{font-size:1.9rem;margin-bottom:14px}
.visit ul{list-style:none;margin:18px 0 26px}
.visit li{margin-bottom:12px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.visit li .ic{color:var(--pink)}
/* testimonials */
.testis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.testi{background:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow);position:relative}
.testi::before{content:'”';position:absolute;top:8px;inset-inline-start:20px;font-size:4rem;color:var(--pink-mid);font-family:serif}
.testi p{margin:22px 0 16px;font-weight:600}
.testi .who{display:flex;align-items:center;gap:10px}
.testi .av{width:42px;height:42px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.testi .stars{color:#f5a623;font-size:.85rem}
/* footer */
footer{background:var(--navy);color:#fff;padding:56px 0 0}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:36px}
footer .name{font-family:'Great Vibes',cursive;font-size:2.1rem;color:#fff}
footer .tag{color:var(--pink-mid);font-size:.75rem;letter-spacing:2px;font-weight:700}
footer p{color:#c6cce4;font-size:.95rem;margin-top:10px}
footer h4{color:#fff;margin-bottom:14px;font-size:1.05rem}
.socials{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.socials a{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;transition:.25s}
.socials a:hover{background:var(--pink);transform:translateY(-3px)}
.socials svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pay-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.35);border-radius:14px;padding:12px 18px;margin-top:8px}
.pay-badge b{color:#fff}
.pay-badge span{color:#c6cce4;font-size:.85rem;display:block}
.contact-list{list-style:none}
.contact-list li{margin-bottom:10px;color:#c6cce4;font-size:.95rem}
.contact-list a:hover{color:#fff}
.copy{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding:18px 0;text-align:center;font-size:.85rem;color:#9aa3c7}
@media(max-width:960px){
  .cats{grid-template-columns:repeat(3,1fr)}
  .prods{grid-template-columns:repeat(2,1fr)}
  .hero .container,.visit .container{grid-template-columns:1fr}
  nav.links{display:none}
  .foot-grid{grid-template-columns:1fr}
  .features .container{grid-template-columns:1fr}
  .hero h1{font-size:2.1rem}
}

.offer{background:linear-gradient(90deg,var(--pink),#f0568f);color:#fff;text-align:center;padding:9px 14px;font-weight:700;font-size:.95rem}
.cart-btn{position:relative;border:0;background:var(--pink-soft);color:var(--pink);width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-inline-start:auto}
.cart-btn svg{width:22px;height:22px}.cart-btn b{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--navy);color:#fff;font-size:.7rem;border-radius:50px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.offers{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px}
.offer-card{background:#fff;border:2px dashed var(--pink-mid);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.offer-card.big{background:linear-gradient(135deg,var(--navy),#34437d);border:0;color:#fff}.offer-card.big h3{color:#fff;font-size:1.5rem}
.offer-card h3{margin-bottom:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.filters button{border:2px solid var(--pink);background:#fff;color:var(--pink);padding:7px 20px;border-radius:50px;font:700 .9rem Cairo,sans-serif;cursor:pointer}
.filters button.on{background:var(--pink);color:#fff}
.prod{position:relative}.prod .badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--gold);color:#fff;font-size:.75rem;font-weight:700;padding:3px 12px;border-radius:50px}
.prod .old{color:#9aa0b8;text-decoration:line-through;font-weight:600;font-size:.9rem;margin-inline-start:6px}
.prod .order{border:0;cursor:pointer;font-family:inherit}
.overlay{position:fixed;inset:0;background:rgba(30,42,82,.5);opacity:0;pointer-events:none;transition:.25s;z-index:90}.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:#fff;z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:.3s}
[dir="rtl"] .drawer{transform:translateX(-100%)}.drawer.on{transform:none!important}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--pink-mid)}.dh button{border:0;background:none;font-size:1.3rem;cursor:pointer}
.ship{padding:14px 20px;background:var(--pink-soft);font-weight:700;font-size:.9rem;color:var(--navy)}
.bar{height:8px;background:#fff;border-radius:8px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:.3s}
.items{flex:1;overflow:auto;padding:10px 20px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f1f6}.it img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.it .n{flex:1;font-weight:700;font-size:.9rem;color:var(--navy)}.it .q{display:flex;gap:6px;align-items:center}
.it .q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--pink);background:#fff;color:var(--pink);cursor:pointer;font-weight:900}
.df{padding:16px 20px;border-top:1px solid var(--pink-mid)}.row{display:flex;justify-content:space-between;margin-bottom:4px}.row.tot{font-size:1.15rem;color:var(--pink);font-weight:900}
@media(max-width:960px){.offers{grid-template-columns:1fr}}
</style>
</head>

let lang = 'ar';
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  document.getElementById('btnAr').classList.toggle('active', l === 'ar');
  document.getElementById('btnEn').classList.toggle('active', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (T[l][k] !== undefined) el.textContent = T[l][k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const k = el.getAttribute('data-i18n-html');
    if (T[l][k] !== undefined) el.innerHTML = T[l][k];
  });
  document.title = T[l].title;
}

let cart={},curCat='__all';
const L=()=>T[lang], fmt=n=>n.toLocaleString(lang==='ar'?'ar-EG':'en-US');
const pname=p=>lang==='ar'?p.ar:(p.en||p.ar);
function renderFilters(){
  const cats=[...new Set(PRODUCTS.map(p=>p.cat))];
  document.getElementById('filters').innerHTML=['__all',...cats].map(c=>`<button class="${c===curCat?'on':''}" data-c="${c}">${c==='__all'?L().all:c}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{curCat=b.dataset.c;renderFilters();renderProducts()});
}
function renderProducts(){
  document.getElementById('prodGrid').innerHTML=PRODUCTS.map((p,i)=>({p,i})).filter(x=>curCat==='__all'||x.p.cat===curCat).map(({p,i})=>`
  <div class="prod">${p.old?`<span class="badge">${L().offer_tag}</span>`:''}<img src="${p.img}" alt="${pname(p)}" loading="lazy">
  <div class="body"><div class="name">${pname(p)}</div>
  <div class="price">${fmt(p.price)} ${L().egp}${p.old?`<span class="old">${fmt(p.old)}</span>`:''}</div>
  <button class="btn order" onclick="addCart(${i})">${L().order}</button></div></div>`).join('');
}
function addCart(i){cart[i]=(cart[i]||0)+1;renderCart();toggleCart(true)}
function chg(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];renderCart()}
function toggleCart(o){document.getElementById('drawer').classList.toggle('on',o);document.getElementById('overlay').classList.toggle('on',o)}
function renderCart(){
  const ids=Object.keys(cart);let sub=0,cnt=0;
  document.getElementById('cartItems').innerHTML=ids.length?ids.map(i=>{const p=PRODUCTS[i],q=cart[i];sub+=p.price*q;cnt+=q;
    return `<div class="it"><img src="${p.img}" alt=""><div class="n">${pname(p)}<div style="color:var(--pink)">${fmt(p.price*q)} ${L().egp}</div></div><div class="q"><button onclick="chg(${i},-1)">−</button><b>${q}</b><button onclick="chg(${i},1)">+</button></div></div>`}).join(''):`<p style="text-align:center;padding:40px 0;color:#9aa0b8">${L().empty}</p>`;
  const free=sub>FREE_SHIP_FROM, left=FREE_SHIP_FROM-sub+1;
  document.getElementById('ship').innerHTML=(free?L().ship_ok:L().ship_more.replace('{n}',fmt(Math.max(left,0))))+`<div class="bar"><i style="width:${Math.min(100,sub/FREE_SHIP_FROM*100)}%"></i></div>`;
  document.getElementById('cartCount').textContent=cnt;
  document.getElementById('sub').textContent=fmt(sub)+' '+L().egp;
  document.getElementById('del').textContent=!ids.length?'-':free?L().free:L().ship_fee.split(' (')[0];
  document.getElementById('tot').textContent=fmt(sub)+' '+L().egp;
  const lines=ids.map(i=>`• ${pname(PRODUCTS[i])} × ${cart[i]} = ${PRODUCTS[i].price*cart[i]} ${L().egp}`).join('\n');
  const msg=L().order_msg+'\n'+lines+'\n\n'+L().total+': '+sub+' '+L().egp+' ('+(free?L().free:L().delivery+'?')+')';
  const a=document.getElementById('sendOrder');a.href=ids.length?'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg):'#';
}
const _setLang=setLang;
setLang=function(l){_setLang(l);renderFilters();renderProducts();renderCart()};
setLang('ar');
fetch('/api/products').then(r=>r.ok?r.json():[]).then(l=>{if(Array.isArray(l)&&l.length){PRODUCTS=l;cart={};curCat='__all';setLang(lang)}}).catch(()=>{});
